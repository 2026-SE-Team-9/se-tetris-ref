plugins {
    // Apply the application plugin to add support for building a CLI application in Java.
    id 'application'
    id 'jacoco'
}

repositories {
    // Use Maven Central for resolving dependencies.
    mavenCentral()
}

dependencies {
    // Use JUnit Jupiter for testing.
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // This dependency is used by the application.
    implementation libs.guava
}

// Apply the Java version required by the project.
java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

application {
    // Define the main class for the application.
    mainClass = 'seoultech.se.tetris.legacy.main.Tetris'
}

tasks.named('test') {
    // Use JUnit Platform for unit tests.
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
}

// The legacy package is reference code, so measure only the project implementation.
def coverageClasses = sourceSets.main.output.classesDirs.asFileTree.matching {
    exclude '**/legacy/**'
}

tasks.named('jacocoTestReport') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(coverageClasses)

    reports {
        xml.required = true
        csv.required = false
        html.required = true
    }
}

tasks.named('jacocoTestCoverageVerification') {
    dependsOn tasks.named('test')
    classDirectories.setFrom(coverageClasses)

    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.50
            }
        }
    }
}

def jpackageExecutable = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(21)
}.map { launcher ->
    def executableName = System.getProperty('os.name').toLowerCase().contains('windows')
            ? 'jpackage.exe'
            : 'jpackage'
    launcher.metadata.installationPath.file("bin/${executableName}")
}

tasks.register('jpackage', Exec) {
    group = 'distribution'
    description = 'Creates a self-contained Tetris application image.'
    dependsOn tasks.named('installDist')

    def inputDirectory = layout.buildDirectory.dir("install/${project.name}/lib")
    def outputDirectory = layout.buildDirectory.dir('jpackage')

    inputs.dir(inputDirectory)
    outputs.dir(outputDirectory)

    doFirst {
        delete outputDirectory
        executable jpackageExecutable.get().asFile
        args '--type', 'app-image',
                '--name', 'Tetris',
                '--input', inputDirectory.get().asFile,
                '--main-jar', tasks.named('jar').get().archiveFileName.get(),
                '--main-class', application.mainClass.get(),
                '--dest', outputDirectory.get().asFile
    }
}
