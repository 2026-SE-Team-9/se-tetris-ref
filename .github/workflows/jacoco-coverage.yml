name: JaCoCo line coverage

on:
  pull_request:
    branches:
      - dev
      - main

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run tests and verify line coverage
        run: ./gradlew :tetris:clean :tetris:test :tetris:jacocoTestCoverageVerification
      - name: Check test and coverage data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          results = list(Path('tetris/build/test-results/test').glob('TEST-*.xml'))
          test_count = sum(int(ET.parse(path).getroot().get('tests', 0)) for path in results)
          assert test_count > 0, 'No tests were executed'

          execution_data = Path('tetris/build/jacoco/test.exec')
          assert execution_data.is_file() and execution_data.stat().st_size > 0, 'JaCoCo execution data is missing'

          report = Path('tetris/build/reports/jacoco/test/jacocoTestReport.xml')
          assert report.is_file(), 'JaCoCo XML report is missing'
          line = next((counter for counter in ET.parse(report).getroot().findall('counter')
                       if counter.get('type') == 'LINE'), None)
          assert line is not None, 'JaCoCo line coverage data is missing'
          covered = int(line.get('covered'))
          missed = int(line.get('missed'))
          assert covered + missed > 0, 'No project lines were measured'
          print(f'Line coverage: {covered}/{covered + missed} ({covered / (covered + missed):.1%})')
          PY
      - name: Upload test and JaCoCo reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-and-jacoco-reports
          path: |
            tetris/build/reports/tests/test/
            tetris/build/reports/jacoco/test/html/
            tetris/build/reports/jacoco/test/jacocoTestReport.xml
          if-no-files-found: warn
