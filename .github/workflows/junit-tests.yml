name: JUnit tests

on:
  pull_request:
    branches:
      - dev
      - main
  push:
    branches:
      - dev
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Run JUnit tests
        run: ./gradlew :tetris:test
      - name: Summarize test results
        if: always()
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import xml.etree.ElementTree as ET

          results = list(Path('tetris/build/test-results/test').glob('TEST-*.xml'))
          suites = [ET.parse(path).getroot() for path in results]
          total = sum(int(suite.get('tests', 0)) for suite in suites)
          failed = sum(int(suite.get('failures', 0)) + int(suite.get('errors', 0)) for suite in suites)
          skipped = sum(int(suite.get('skipped', 0)) for suite in suites)

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write('### JUnit 테스트 결과\n\n')
              summary.write(f'- 전체 {total}개: 성공 {total - failed - skipped}, 실패 {failed}, 건너뜀 {skipped}\n')

          assert total > 0, 'No tests were executed'
          PY
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: junit-test-reports
          path: |
            tetris/build/reports/tests/test/
            tetris/build/test-results/test/
          if-no-files-found: warn
